services:
  neo4j_db:
    image: neo4j:latest
    container_name: text2kg-neo4j_db
    restart: unless-stopped

    # No public ports: accessible internally by the API
    expose:
      - "7687"

    volumes:
      - ./.neo4j/data:/data
      - ./.neo4j/logs:/logs
      - ./.neo4j/conf:/conf
      - ./.neo4j/import:/var/lib/neo4j/import
      - ./.neo4j/plugins:/plugins

    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH in your environment}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"

  api:
    build:
      context: ./api
    container_name: text2kg-api
    restart: unless-stopped
    env_file:
      - ./api/.env

    # Nginx can reach the API through the internal Docker network
    expose:
      - "8000"

    depends_on:
      - neo4j_db

  app:
    build:
      context: ./app
      args:
        VITE_API_URL: /api
    container_name: text2kg-app
    restart: unless-stopped

    # Nginx serves the app; no public port
    expose:
      - "5173"

    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: text2kg-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app
      - api